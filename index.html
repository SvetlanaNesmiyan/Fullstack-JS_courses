<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>SVG</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>SVG</h1>
    <div class="container">
        <svg viewBox="0 0 800 300">
            <rect class="square" x="50" y="50" width="100" height="100"></rect>
            <rect class="rectangle" x="220" y="50" width="150" height="100"></rect>
            <path class="animated-heart" 
                  d="M480,70 
                     C465,55 450,55 440,70 
                     C430,85 430,100 440,115 
                     C450,130 465,145 480,145 
                     C495,145 510,130 520,115 
                     C530,100 530,85 520,70 
                     C510,55 495,55 480,70Z" 
                  transform-origin="480px 100px"></path>
            <ellipse class="ellipse" cx="650" cy="100" rx="70" ry="40"></ellipse>
            
            <text x="75" y="180" font-size="14">Квадрат</text>
            <text x="250" y="180" font-size="14">Прямокутник</text>
            <text x="460" y="180" font-size="14">Серце (анімоване)</text>
            <text x="620" y="180" font-size="14">Еліпс</text>
        </svg>
    </div>
</body>
</html>
