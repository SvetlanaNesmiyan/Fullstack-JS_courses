<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>SVG</title>
    <style>
        .animated-heart {
            animation: 
                color-change 3s infinite alternate,
                pulse 1.2s infinite ease-in-out;
        }
        
        @keyframes color-change {
            0% {
                stroke: #3498db;
                fill: #1abc9c;
            }
            50% {
                stroke: #e74c3c;
                fill: #f1c40f;
            }
            100% {
                stroke: #9b59b6;
                fill: #e67e22;
            }
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .container {
            display: flex;
            justify-content: center;
            background: #f8f9fa;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
        }

        svg {
            width: 100%;
            max-width: 800px;
        }
    </style>
</head>
<body>
    <h1>SVG </h1>
    <div class="container">
        <svg viewBox="0 0 800 300">
            <rect x="50" y="50" width="100" height="100" 
                  stroke="#e74c3c" stroke-width="5" fill="#f1c40f" />
            
            <rect x="220" y="50" width="150" height="100" 
                  stroke="#2ecc71" stroke-width="5" fill="#3498db" />
            
            <path class="animated-heart" 
                  d="M480,70 
                     C465,55 450,55 440,70 
                     C430,85 430,100 440,115 
                     C450,130 465,145 480,145 
                     C495,145 510,130 520,115 
                     C530,100 530,85 520,70 
                     C510,55 495,55 480,70Z" 
                  stroke="#3498db" stroke-width="5" fill="#1abc9c" 
                  transform-origin="480px 100px" />
            
            <ellipse cx="650" cy="100" rx="70" ry="40" 
                     stroke="#9b59b6" stroke-width="5" fill="#e67e22" />
            
            <text x="75" y="180" font-size="14">Квадрат</text>
            <text x="250" y="180" font-size="14">Прямокутник</text>
            <text x="460" y="180" font-size="14">Серце (анімоване)</text>
            <text x="620" y="180" font-size="14">Еліпс</text>
        </svg>
    </div>
</body>
</html>
