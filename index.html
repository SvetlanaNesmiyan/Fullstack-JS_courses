<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search - Пошук фільмів</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">🎬 Movie Search</h1>
            <p class="subtitle">Знайдіть ваші улюблені фільми та серіали</p>
        </header>

        <main class="main">
            <div class="search-container">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Введіть назву фільму або серіалу..."
                        class="search-input"
                    >
                    <div class="search-icon">🔍</div>
                </div>
            </div>

            <!-- Панель фільтрів -->
            <div class="filters-bar" id="filtersBar" style="display: none;">
                <div class="filters-container">
                    <div class="filter-group">
                        <span class="filter-label">Тип:</span>
                        <div class="filter-options">
                            <button class="filter-btn active" data-type="">Всі</button>
                            <button class="filter-btn" data-type="movie">Фільми</button>
                            <button class="filter-btn" data-type="series">Серіали</button>
                            <button class="filter-btn" data-type="episode">Епізоди</button>
                        </div>
                    </div>
                    
                    <div class="filter-group">
                        <span class="filter-label">Рік:</span>
                        <div class="filter-options">
                            <button class="filter-btn active" data-year="">Всі роки</button>
                            <button class="filter-btn" data-year="2024">2024</button>
                            <button class="filter-btn" data-year="2023">2023</button>
                            <button class="filter-btn" data-year="2022">2022</button>
                            <button class="filter-btn" data-year="2021">2021</button>
                            <button class="filter-btn" data-year="2020">2020</button>
                            <button class="filter-btn more-years">Більше...</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Пошук...</p>
            </div>

            <div class="error-message" id="errorMessage" style="display: none;"></div>

            <div class="results-container" id="resultsContainer">
                <div class="results-stats" id="resultsStats" style="display: none;"></div>
                <div class="results-grid" id="resultsGrid"></div>
                <div class="load-more" id="loadMore" style="display: none;">
                    <button id="loadMoreBtn" class="load-more-btn">Завантажити ще</button>
                </div>
            </div>

            <div class="no-results" id="noResults" style="display: none;">
                <p>Нічого не знайдено. Спробуйте змінити запит.</p>
            </div>
        </main>

        <footer class="footer">
            <p>Дані надані <a href="http://www.omdbapi.com/" target="_blank">OMDb API</a></p>
        </footer>
    </div>

    <!-- Модальне вікно для детальної інформації -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Модальне вікно для вибору років -->
    <div class="modal" id="yearsModal">
        <div class="modal-content">
            <span class="close-btn" id="closeYearsModal">&times;</span>
            <h3>Оберіть рік</h3>
            <div class="years-grid" id="yearsGrid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
